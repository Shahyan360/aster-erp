<div class="flex flex-col gap-4">
    <app-select-field
        fieldId="dateType"
        label="Date Type"
        formControlName="dateType"
        [options]="dateTypeOptions"
        optionLabel="label"
        optionValue="value"
        [filter]="false"
        [showClear]="false"
    />

    @if (showFinancialYearSelect()) {
        <app-select-field
            fieldId="financialYearId"
            label="Financial Year"
            formControlName="financialYearId"
            [options]="financialYears()"
            optionLabel="financialYearName"
            optionValue="id"
            [filter]="false"
            [showClear]="false"
        />
    }
</div>
